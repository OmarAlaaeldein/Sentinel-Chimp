name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version / tag name (e.g. 1.8 or v1.8)"
        required: true
        default: "1.8"
  push:
    tags:
      - "v*"
      - "1.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Sentinel.exe
            platform: windows
          - os: ubuntu-latest
            artifact: Sentinel-Linux-x64
            platform: linux
          - os: macos-latest
            artifact: Sentinel-macOS-unsigned.dmg
            platform: macos

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install OS Tk dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev binutils upx-ucl

      - name: Install UPX (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install upx -y --no-progress

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt

      - name: Build Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/build_release.ps1

      - name: Build Linux artifact
        if: matrix.platform == 'linux'
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh --platform linux

      - name: Build macOS artifact
        if: matrix.platform == 'macos'
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh --platform macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Normalize: strip leading whitespace
          TAG="${TAG# }"
          if [[ -z "$TAG" ]]; then
            echo "Empty tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sentinel Chimp ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/Sentinel.exe
            release-assets/Sentinel-Linux-x64
            release-assets/Sentinel-macOS-unsigned.dmg
          body: |
            ## Sentinel Chimp ${{ steps.tag.outputs.tag }} — Lite Mode native installers

            Prebuilt **Lite Mode** binaries (no FinBERT / PyTorch). AI sentiment remains **source-only** (`pip install -r requirements.txt` + `python sentinel.py`).

            ### What's new in 2.4.0
            - **Stock Relationship Graph:** Relational market graph (`core/stock_graph.py`, `core/graph_data.py`) spanning the entire NASDAQ-100 and S&P 500 universe (212 nodes, 441 edges) across all 11 GICS sectors
            - **Quantitative Peer Divergence Scanner:** `sentinel graph divergence TICKER --period 1mo` calculates relative performance spreads, return correlations, and z-score divergence to identify leading outperformers and lagging catch-up candidates
            - **Peer Network Explorer:** `sentinel graph show [TICKER]` and `sentinel graph peers TICKER` classify supplier, customer, competitor, infrastructure, and energy relationships
            - **Interactive 2D/3D Network Visualization:** `sentinel graph export [TICKER] --html PATH` generates standalone dark-themed Plotly 2D/3D network maps with force-directed physics layout
            - **Robust Index Coverage:** Zero isolated nodes, complete sector diversity, and cross-sector supply chain pathfinding

            ### What's new in 2.3.0
            - **Local Ollama CLI:** `sentinel models list/show/select/current`, `sentinel profiles list/use`, `sentinel ask`, `sentinel config` for local model discovery, profiles, and prompt queries
            - **Fast CLI startup:** Lazy module imports ensure `sentinel --help` and CLI commands load in milliseconds without initializing heavy numerical or GUI libraries (torch, tkinter, pandas, numpy)
            - **Hardened scanning & exports:** Clean stdout in JSON mode, full-row CSV exports regardless of `--limit`, empty CSV headers, structured expiry errors, NaN safety, and nonnegative argument validation
            - **Python 3.9 compatibility:** Fixed module-level staticmethod wrappers affecting batch pricing

            ### What's new in 2.2.3
            - **Native binary startup fix:** Restored `unittest` and `pydoc` stdlib modules in PyInstaller builds (required at runtime by `pyparsing` / `matplotlib` and `pyarrow`), fixing startup failure on Windows, macOS, and Linux
            - **Windows terminal encoding:** UTF-8 stream reconfigure and ASCII-safe symbols for `verify` CLI

            ### What's new in 2.2.2
            - **Smaller binaries:** UPX compression (Windows), `--strip` (Linux/macOS), plus excludes for test subpackages and unused Qt/Wx/GTK/Cairo backends. plotly and 3D export fully kept.

            ### What's new in 2.2
            - **Left panel fix:** Technicals values wrap instead of clipping (pane min-width, wrapping value column, shorter Vol/Bollinger strings)
            - **Docs refresh:** full CLI flag table + `verify`, accurate project structure, sentiment corrections (off by default, 0–1 scale), v2.1 performance notes, archived workflow templates marked superseded

            ### What's new in 2.1 (also in this release)
            - **Lower footprint:** bounded data/chain/news/valuation caches, news cap 1000 → 150 headlines, trimmed system log, hover throttled, lazy `matplotlib.pyplot` / `plotly` / `torch` imports at startup
            - **Faster scans:** vectorized liquidity/ATM filters, leaner GARCH fit (~4–5×), chunked sentiment inference
            - **Leaner packages:** `requirements.txt` drops `pytest` (CI-only) and `accelerate` (unused); stale screenshots, spec, and distilBERT ignores removed
            - **Build fix:** macOS sentiment auto-detect now reads `main/app.py` where the flag lives

            ### Downloads
            | Platform | Artifact |
            | --- | --- |
            | **Windows x64** | `Sentinel.exe` — download and run |
            | **Linux x64** | `Sentinel-Linux-x64` — `chmod +x` then run |
            | **macOS (unsigned)** | `Sentinel-macOS-unsigned.dmg` — open DMG, then see Gatekeeper note |

            ### macOS Gatekeeper (unsigned)
            This macOS build is **not code-signed** and **not notarized**.
            - Open the DMG, then **right-click** `Sentinel.app` → **Open**, and confirm; or
            - `xattr -dr com.apple.quarantine /path/to/Sentinel.app && open /path/to/Sentinel.app`

            ### Linux
            Desktop environment with Tk recommended. Mark executable if needed: `chmod +x Sentinel-Linux-x64 && ./Sentinel-Linux-x64`

            ### What's in Lite Mode
            Charting, technicals, Bjerksund-Stensland options math, EWMA/HV vol, Options Finder, 3D plot — **included**.
            FinBERT AI sentiment — **not bundled** (use source for full features).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
