name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version / tag name (e.g. 1.8 or v1.8)"
        required: true
        default: "1.8"
  push:
    tags:
      - "v*"
      - "1.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Sentinel.exe
            platform: windows
          - os: ubuntu-latest
            artifact: Sentinel-Linux-x64
            platform: linux
          - os: macos-latest
            artifact: Sentinel-macOS-unsigned.dmg
            platform: macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install OS Tk dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-release.txt

      - name: Build Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/build_release.ps1

      - name: Build Linux artifact
        if: matrix.platform == 'linux'
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh --platform linux

      - name: Build macOS artifact
        if: matrix.platform == 'macos'
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh --platform macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Normalize: strip leading whitespace
          TAG="${TAG# }"
          if [[ -z "$TAG" ]]; then
            echo "Empty tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sentinel Chimp ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/Sentinel.exe
            release-assets/Sentinel-Linux-x64
            release-assets/Sentinel-macOS-unsigned.dmg
          body: |
            ## Sentinel Chimp ${{ steps.tag.outputs.tag }} — Lite Mode native installers

            Prebuilt **Lite Mode** binaries (no FinBERT / PyTorch). AI sentiment remains **source-only** (`pip install -r requirements.txt` + `python sentinel.py`).

            ### What's new
            - **UI readability / 3D:** clearer fonts, improved Options Explorer labels, richer EV@Ask 3D visualization (PR #8)
            - **Native release assets** (no zip packs): Windows `.exe`, macOS `.dmg`, Linux single binary

            ### Downloads
            | Platform | Artifact |
            | --- | --- |
            | **Windows x64** | `Sentinel.exe` — download and run |
            | **Linux x64** | `Sentinel-Linux-x64` — `chmod +x` then run |
            | **macOS (unsigned)** | `Sentinel-macOS-unsigned.dmg` — open DMG, then see Gatekeeper note |

            ### macOS Gatekeeper (unsigned)
            This macOS build is **not code-signed** and **not notarized**.
            - Open the DMG, then **right-click** `Sentinel.app` → **Open**, and confirm; or
            - `xattr -dr com.apple.quarantine /path/to/Sentinel.app && open /path/to/Sentinel.app`

            ### Linux
            Desktop environment with Tk recommended. Mark executable if needed: `chmod +x Sentinel-Linux-x64 && ./Sentinel-Linux-x64`

            ### What's in Lite Mode
            Charting, technicals, Bjerksund-Stensland options math, EWMA/HV vol, Options Finder, 3D plot — **included**.
            FinBERT AI sentiment — **not bundled** (use source for full features).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
